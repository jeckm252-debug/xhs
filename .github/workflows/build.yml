name: Build XHSLiquidGlass.dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        run: |
          if [ -f Tweak.m ]; then
            mkdir -p src && cp Tweak.m src/
          else
            ZIP=$(ls *.zip | head -1)
            echo "Using $ZIP"
            unzip -o "$ZIP" -d src
          fi
          find src -name "Tweak.m"

      - name: Build dylib (arm64 + arm64e)
        run: |
          TWEAK=$(find src -name "Tweak.m" | head -1)
          echo "Building $TWEAK"
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e \
            -mios-version-min=14.0 \
            -fobjc-arc -O2 -dynamiclib \
            "$TWEAK" -o XHSLiquidGlass.dylib \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -install_name @rpath/XHSLiquidGlass.dylib
          file XHSLiquidGlass.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XHSLiquidGlass-dylib
          path: XHSLiquidGlass.dylib

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: XHSLiquidGlass.dylib
